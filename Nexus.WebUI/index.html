<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>NexusHub | Kontrol Paneli</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="sidebar">
      <div class="logo-details">
        <i class="bx bxl-nexus icon"></i>
        <div class="logo_name">NexusHub</div>
        <i class="bx bx-menu" id="btn"></i>
      </div>
      <ul class="nav-list">
        <li>
          <a href="#" id="nav-dashboard">
            <i class="bx bx-grid-alt"></i>
            <span class="links_name">Genel Bakış</span>
          </a>
        </li>
        <li>
          <a href="#" id="nav-devices">
            <i class="bx bx-devices"></i>
            <span class="links_name">Cihaz Listesi</span>
          </a>
        </li>
      </ul>
    </div>

    <section class="home-section">
      <div class="header">
        <h1 id="page-title">Genel Bakış</h1>
      </div>
      <div class="nexus-card" style="margin-bottom: 20px">
        <h3>Yeni Cihaz Ekle</h3>
        <div style="display: flex; gap: 10px; margin-top: 10px">
          <input
            type="text"
            id="devName"
            placeholder="Cihaz Adı"
            style="padding: 8px; border-radius: 5px; border: 1px solid #ddd"
          />
          <input
            type="text"
            id="devIp"
            placeholder="IP Adresi"
            style="padding: 8px; border-radius: 5px; border: 1px solid #ddd"
          />
          <button
            onclick="addDevice()"
            style="
              background: #1d1b31;
              color: white;
              padding: 8px 20px;
              border: none;
              border-radius: 5px;
              cursor: pointer;
            "
          >
            Ekle
          </button>
        </div>
      </div>
      <div id="main-content" class="content-container"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
